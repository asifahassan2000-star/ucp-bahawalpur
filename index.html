    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (reason && (
          (typeof reason.message === 'string' && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('closed without opened') !== -1)) ||
          (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('closed without opened') !== -1))
        )) {
          event.preventDefault();
        }
      });
    </script>
