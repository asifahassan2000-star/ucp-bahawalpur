    <script>
      // Suppress and intercept Vite HMR WebSocket connection errors in sandbox iframe environment
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Intercept Vite HMR WebSocket attempts to prevent network failures & connection closing errors
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = protocols === 'vite-hmr' || urlStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf('token=') !== -1 || urlStr.indexOf(':24678') !== -1;
            if (isViteHmr) {
              var listeners = {};
              var fake = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // WebSocket.OPEN
                url: urlStr,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {
                  fake.readyState = 3;
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn(new Event('open')); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function(event) {
                  var cbs = listeners[event.type] || [];
                  cbs.forEach(function(cb) {
                    try { cb(event); } catch(e) {}
                  });
                  return true;
                }
              };
              return fake;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Global Unhandled Rejection interceptor
        function isWsError(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1 || str.indexOf('vite:ws') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsError(event.message || event.error)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        // 3. Filter console.error from vite client
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var first = args[0];
          if (typeof first === 'string' && (
            first.indexOf('[vite] failed to connect to websocket') !== -1 || 
            first.indexOf('WebSocket closed without opened') !== -1
          )) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
